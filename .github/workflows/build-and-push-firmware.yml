name: Build and push firmware

on:
  workflow_call:
    outputs:
      timestamp:
        description: "Build date timestamp"
        value: ${{ jobs.collect.outputs.timestamp }}

jobs:
  prepare-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare image
        uses: ./.github/actions/prepare-image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          image-name: "grid-fw"
          dockerfile: "Dockerfile"

  build-target:
    needs: prepare-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      image: ghcr.io/${{ github.repository_owner }}/grid-fw:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            build_cmd: "./lua_build.sh && ./mxt_config.sh && ./pico_build.sh && ./esp_build.sh"
            artifact_paths: esp32s3/build/grid_esp32s3.uf2
          - target: d51
            build_cmd: "./lua_build.sh && ./d51_build.sh"
            artifact_paths: d51n20a/gcc/build/grid_d51n20a.uf2
          - target: rp2350
            build_cmd: "./lua_build.sh && ./mxt_config.sh && ./rp2350_build.sh"
            artifact_paths: rp2350/build/main/grid_rp2350.uf2
          - target: wasm
            build_cmd: "./lua_build.sh && ./wasm_build.sh"
            artifact_paths: |
              wasm/build/index.html
              wasm/build/index.js
              wasm/build/index.wasm
    steps:

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.image }}

      - name: Build ${{ matrix.target }} firmware
        run: |
          docker run -v $PWD:/project -w /project ${{ env.image }} \
          sh -c "${{ matrix.build_cmd }}"

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v6
        with:
          name: fw-${{ matrix.target }}
          path: ${{ matrix.artifact_paths }}

  collect:
    needs: build-target
    runs-on: ubuntu-latest
    env:
      d51-path: d51n20a
      esp-path: esp32s3
      rp2350-path: rp2350
    outputs:
      timestamp: ${{ steps.set_out.outputs.timestamp }}
    steps:

      - name: Download esp32 artifact
        uses: actions/download-artifact@v4
        with:
          name: fw-esp32
          path: ${{ env.esp-path }}/build

      - name: Download d51 artifact
        uses: actions/download-artifact@v4
        with:
          name: fw-d51
          path: ${{ env.d51-path }}/gcc/build

      - name: Download rp2350 artifact
        uses: actions/download-artifact@v4
        with:
          name: fw-rp2350
          path: ${{ env.rp2350-path }}/build/main

      - name: Download wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: fw-wasm
          path: wasm/build

      - name: Set timestamp in environment and output
        id: set_out
        run: |
          ACTION_DATE=$(date +'%Y-%m-%d-%H%M')
          echo "ACTION_DATE=$ACTION_DATE" >> $GITHUB_ENV
          echo "timestamp=$ACTION_DATE" >> $GITHUB_OUTPUT

      - name: Copy and rename artifacts
        run: |
          cp ${{ env.esp-path }}/build/grid_esp32s3.uf2 grid_esp32_release_${{ env.ACTION_DATE }}.uf2
          cp ${{ env.esp-path }}/build/grid_esp32s3.uf2 grid_esp32_nightly_${{ env.ACTION_DATE }}.uf2
          cp ${{ env.d51-path }}/gcc/build/grid_d51n20a.uf2 grid_d51_release_${{ env.ACTION_DATE }}.uf2
          cp ${{ env.d51-path }}/gcc/build/grid_d51n20a.uf2 grid_d51_nightly_${{ env.ACTION_DATE }}.uf2
          cp ${{ env.rp2350-path }}/build/main/grid_rp2350.uf2 grid_rp2350_release_${{ env.ACTION_DATE }}.uf2
          cp ${{ env.rp2350-path }}/build/main/grid_rp2350.uf2 grid_rp2350_nightly_${{ env.ACTION_DATE }}.uf2
          cat ${{ env.d51-path }}/gcc/build/grid_d51n20a.uf2 ${{ env.esp-path }}/build/grid_esp32s3.uf2 ${{ env.rp2350-path }}/build/main/grid_rp2350.uf2 \
            > grid_multiarch_nightly_${{ env.ACTION_DATE }}.uf2
          cp grid_multiarch_nightly_${{ env.ACTION_DATE }}.uf2 grid_multiarch_release_${{ env.ACTION_DATE }}.uf2
          cp wasm/build/index.html index.html
          cp wasm/build/index.js index.js
          cp wasm/build/index.wasm index.wasm

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nightly_firmware
          path: |
            grid_esp32_nightly_${{ env.ACTION_DATE }}.uf2
            grid_d51_nightly_${{ env.ACTION_DATE }}.uf2
            grid_rp2350_nightly_${{ env.ACTION_DATE }}.uf2
            grid_multiarch_nightly_${{ env.ACTION_DATE }}.uf2

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release_firmware
          path: |
            grid_esp32_release_${{ env.ACTION_DATE }}.uf2
            grid_d51_release_${{ env.ACTION_DATE }}.uf2
            grid_rp2350_release_${{ env.ACTION_DATE }}.uf2
            grid_multiarch_release_${{ env.ACTION_DATE }}.uf2

      - name: Upload gui artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nightly_gui
          path: |
            index.html
            index.js
            index.wasm
