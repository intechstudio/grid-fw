<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Grid VSN1L Simulator</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #14161a;
        color: #e8e8e8;
        margin: 0;
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #status { font-size: 13px; color: #9aa; min-height: 1.2em; }
      #progress { width: 200px; }

      .screen-wrap {
        width: 100%;
        max-width: 480px;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        border: 1px solid #333;
      }
      canvas.emscripten {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
        border: 0;
      }

      .panel {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .button-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        width: 100%;
      }
      .btn {
        touch-action: none;
        user-select: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 56px;
        border-radius: 10px;
        background: #23262d;
        border: 1px solid #3a3e46;
        color: #ddd;
        font-size: 13px;
      }
      .btn:active, .btn.pressed { background: #3a3e46; border-color: #666; }
      .led {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #000;
        border: 1px solid #444;
      }

      .dial-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .dial-outer {
        touch-action: none;
        user-select: none;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, #2c3038, #1a1c21);
        border: 1px solid #3a3e46;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dial-needle {
        position: absolute;
        top: 10px;
        left: 50%;
        width: 3px;
        height: 22px;
        background: #7fd0ff;
        border-radius: 2px;
        transform-origin: 50% 60px;
      }
      .dial-inner {
        touch-action: none;
        user-select: none;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #23262d;
        border: 1px solid #4a4e56;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #aaa;
      }
      .dial-inner:active, .dial-inner.pressed { background: #3a3e46; }
      .dial-leds { display: flex; gap: 5px; }

      label.section { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #777; align-self: flex-start; }

      .console-wrap {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .console-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .console-header button {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 6px;
        background: #23262d;
        border: 1px solid #3a3e46;
        color: #ccc;
      }
      .console-box {
        width: 100%;
        height: 160px;
        overflow-y: auto;
        background: #0b0c0e;
        border: 1px solid #333;
        border-radius: 8px;
        margin: 0;
        padding: 8px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-all;
        -webkit-overflow-scrolling: touch;
      }
      .console-box .err { color: #ff8080; }
      .console-box .sent { color: #7fd0ff; }

      .console-input-row {
        display: flex;
        gap: 6px;
      }
      .console-input-row select {
        background: #0b0c0e;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 8px 4px;
        color: #e8e8e8;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .console-input-row input {
        flex: 1;
        min-width: 0;
        background: #0b0c0e;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 8px;
        color: #e8e8e8;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .console-input-row button {
        font-size: 12px;
        padding: 8px 14px;
        border-radius: 6px;
        background: #23262d;
        border: 1px solid #3a3e46;
        color: #ccc;
      }
    </style>
  </head>
  <body>
    <div id="status">Downloading...</div>
    <progress value="0" max="100" id="progress" hidden="1"></progress>

    <div class="screen-wrap">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div class="panel">
      <div style="width:100%">
        <label class="section">Buttons 0-7</label>
        <div class="button-row" id="row-top"></div>
      </div>

      <div class="dial-area">
        <label class="section">Endless (8)</label>
        <div class="dial-outer" id="dial-outer">
          <div class="dial-needle" id="dial-needle"></div>
          <div class="dial-inner" id="dial-push">push</div>
        </div>
        <div class="dial-leds" id="dial-leds"></div>
      </div>

      <div style="width:100%">
        <label class="section">Buttons 9-12</label>
        <div class="button-row" id="row-bottom"></div>
      </div>
    </div>

    <div class="console-wrap">
      <div class="console-header">
        <label class="section" style="margin:0">Console (grid_platform_printf)</label>
        <button id="console-clear" type="button">Clear</button>
      </div>
      <pre id="console" class="console-box"></pre>
    </div>

    <div class="console-wrap">
      <div class="console-header">
        <label class="section" style="margin:0">USB serial (raw)</label>
        <button id="usb-console-clear" type="button">Clear</button>
      </div>
      <pre id="usb-console" class="console-box"></pre>
      <div class="console-input-row">
        <select id="usb-send-port" title="Port to inject into">
          <option value="0">N</option>
          <option value="1">E</option>
          <option value="2">S</option>
          <option value="3">W</option>
          <option value="4" selected>UI</option>
          <option value="5">USB</option>
        </select>
        <input id="usb-send-input" type="text" placeholder="type text, or \xNN for raw bytes (e.g. \x01)" autocomplete="off"
          value="\x01\x0f003500517f7f00000000\x17\x02086e000104000dprint(&quot;test&quot;)\x03">
        <button id="usb-send-btn" type="button">Send</button>
      </div>
    </div>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');

      // On-page consoles. Capped (per-instance) so neither the DOM nor the
      // visible scrollback grows unbounded. makeConsole() returns an
      // appendLine(text, className) function bound to one <pre>/clear-button
      // pair; className is optional ('err', 'sent', or falsy for a plain line).
      function makeConsole(preId, clearButtonId, maxLines) {
        var el = document.getElementById(preId);
        var lines = [];
        document.getElementById(clearButtonId).addEventListener('click', () => {
          el.textContent = '';
          lines = [];
        });
        return function appendLine(text, className) {
          var atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
          var span = document.createElement('span');
          if (className) span.className = className;
          span.textContent = text + '\n';
          el.appendChild(span);
          lines.push(span);
          while (lines.length > maxLines) {
            el.removeChild(lines.shift());
          }
          if (atBottom) el.scrollTop = el.scrollHeight;
        };
      }

      // grid_platform_printf() (wasm/platform.c) comes through Module.print
      // as one line; runtime/JS-side errors come through Module.printErr.
      var appendConsoleLine = makeConsole('console', 'console-clear', 400);

      // Raw bytes this module has queued to send out its USB serial port -
      // grid_usb_acm_write() (wasm/usb_stub.c), captured via
      // grid_sim_port_drain_tx_bytes(GRID_SIM_PORT_USB) - see startUsbPolling().
      // Also where sendUsbMessage() below echoes what it injected.
      var appendUsbLine = makeConsole('usb-console', 'usb-console-clear', 10);

      // Protocol frames use control bytes (STX/ETX/etc) that don't render -
      // show anything outside printable ASCII as \xNN, like
      // grid_platform_printf_nonprint() (wasm/platform.c) does for the
      // native console.
      function escapeBytes(bytes) {
        var out = '';
        for (var i = 0; i < bytes.length; i++) {
          var c = bytes[i];
          out += (c >= 0x20 && c < 0x7f) ? String.fromCharCode(c) : '\\x' + c.toString(16).padStart(2, '0');
        }
        return out;
      }

      // Inverse of escapeBytes(): literal characters pass through as their
      // own byte, \xNN sequences become the raw byte NN - so typing a real
      // control byte (e.g. \x01 for STX) is possible without needing to
      // paste one in directly.
      function parseEscapedBytes(text) {
        var out = [];
        for (var i = 0; i < text.length; i++) {
          if (text[i] === '\\' && text[i + 1] === 'x' && i + 3 < text.length) {
            var val = parseInt(text.substr(i + 2, 2), 16);
            if (!isNaN(val)) {
              out.push(val);
              i += 3;
              continue;
            }
          }
          out.push(text.charCodeAt(i) & 0xff);
        }
        return new Uint8Array(out);
      }

      var Module = {
        print: (...args) => { var text = args.join(' '); console.log(text); appendConsoleLine(text); },
        printErr: (...args) => { var text = args.join(' '); console.error(text); appendConsoleLine(text, 'err'); },
        canvas: document.getElementById('canvas'),
        setStatus: (text) => {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2]) * 100;
            progressElement.max = parseInt(m[4]) * 100;
            progressElement.hidden = false;
          } else {
            progressElement.hidden = true;
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: (left) => {
          Module.totalDependencies = Math.max(Module.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (Module.totalDependencies - left) + '/' + Module.totalDependencies + ')' : 'Ready');
        },
      };

      // Tells emscripten's SDL layer not to capture/preventDefault()
      // keyboard events at all - this page has no keyboard-driven module
      // controls (buttons/dial are pointer-only), so there's no reason for
      // SDL to intercept typing anywhere on the page. Whitelisted via
      // -sINCOMING_MODULE_JS_API in wasm/CMakeLists.txt, or this aborts.
      Module.doNotCaptureKeyboard = true;

      Module.setStatus('Downloading...');
      window.onerror = () => {
        Module.setStatus('Exception thrown, see JavaScript console');
      };

      // ---- On-screen controls (touch/mouse), wired once the wasm runtime is up ----

      function callVoid(name, types, args) { Module.ccall(name, null, types, args); }

      function makeButton(container, element, label) {
        var btn = document.createElement('div');
        btn.className = 'btn';
        btn.innerHTML = '<span>' + label + '</span><span class="led" data-led></span>';
        container.appendChild(btn);

        var press = (e) => { e.preventDefault(); btn.classList.add('pressed'); callVoid('grid_sim_input_button', ['number', 'number'], [element, 1]); };
        var release = (e) => { e.preventDefault(); btn.classList.remove('pressed'); callVoid('grid_sim_input_button', ['number', 'number'], [element, 0]); };

        btn.addEventListener('pointerdown', press);
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointercancel', release);
        btn.addEventListener('pointerleave', (e) => { if (btn.classList.contains('pressed')) release(e); });

        return btn;
      }

      function setupButtonRows() {
        var top = document.getElementById('row-top');
        var bottom = document.getElementById('row-bottom');
        for (var i = 0; i <= 7; i++) makeButton(top, i, 'B' + i);
        for (var i = 9; i <= 12; i++) makeButton(bottom, i, 'B' + i);

        for (var i = 0; i < 5; i++) {
          var led = document.createElement('span');
          led.className = 'led';
          led.dataset.dialLed = i;
          document.getElementById('dial-leds').appendChild(led);
        }
      }

      function setupDial() {
        var outer = document.getElementById('dial-outer');
        var inner = document.getElementById('dial-push');
        var needle = document.getElementById('dial-needle');

        var dragging = false;
        var lastAngle = 0;
        var accumDeg = 0;
        var needleDeg = 0;
        var DEG_PER_STEP = 8;

        function angleAt(e) {
          var rect = outer.getBoundingClientRect();
          var cx = rect.left + rect.width / 2;
          var cy = rect.top + rect.height / 2;
          return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
        }

        outer.addEventListener('pointerdown', (e) => {
          if (e.target === inner) return;
          e.preventDefault();
          dragging = true;
          outer.setPointerCapture(e.pointerId);
          lastAngle = angleAt(e);
        });

        outer.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          e.preventDefault();
          var a = angleAt(e);
          var diff = a - lastAngle;
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          lastAngle = a;

          accumDeg += diff;
          needleDeg += diff;
          needle.style.transform = 'rotate(' + needleDeg + 'deg)';

          while (accumDeg >= DEG_PER_STEP) {
            callVoid('grid_sim_input_endless_rotate', ['number', 'number'], [8, 1]);
            accumDeg -= DEG_PER_STEP;
          }
          while (accumDeg <= -DEG_PER_STEP) {
            callVoid('grid_sim_input_endless_rotate', ['number', 'number'], [8, -1]);
            accumDeg += DEG_PER_STEP;
          }
        });

        var stopDrag = (e) => { dragging = false; };
        outer.addEventListener('pointerup', stopDrag);
        outer.addEventListener('pointercancel', stopDrag);

        var push = (e) => { e.preventDefault(); e.stopPropagation(); inner.classList.add('pressed'); callVoid('grid_sim_input_endless_button', ['number', 'number'], [8, 1]); };
        var release = (e) => { e.preventDefault(); e.stopPropagation(); inner.classList.remove('pressed'); callVoid('grid_sim_input_endless_button', ['number', 'number'], [8, 0]); };
        inner.addEventListener('pointerdown', push);
        inner.addEventListener('pointerup', release);
        inner.addEventListener('pointercancel', release);
        inner.addEventListener('pointerleave', (e) => { if (inner.classList.contains('pressed')) release(e); });
      }

      function packedToCss(packed) {
        var r = (packed >> 16) & 0xff, g = (packed >> 8) & 0xff, b = packed & 0xff;
        return 'rgb(' + r + ',' + g + ',' + b + ')';
      }

      function startLedPolling() {
        var getPacked = Module.cwrap('grid_sim_get_element_led_rgb_packed', 'number', ['number']);
        var getPackedLed = Module.cwrap('grid_sim_get_led_rgb_packed', 'number', ['number']);
        var getIndices = Module.cwrap('grid_sim_get_element_led_indices', 'number', ['number', 'number', 'number']);

        // Element 8's LED indices are looked up fresh every tick, not cached
        // once at startup: onRuntimeInitialized can fire before main() (and
        // therefore grid_sim_init()) has actually run, which would
        // permanently cache an empty list. This lookup is cheap (5 LEDs),
        // so there's no real cost to redoing it each poll.
        var dialLedPtr = Module._malloc(8);

        setInterval(() => {
          document.getElementById('row-top').querySelectorAll('.btn').forEach((btn, i) => {
            btn.querySelector('[data-led]').style.background = packedToCss(getPacked(i));
          });
          document.getElementById('row-bottom').querySelectorAll('.btn').forEach((btn, i) => {
            btn.querySelector('[data-led]').style.background = packedToCss(getPacked(i + 9));
          });

          var n = getIndices(8, dialLedPtr, 8);
          document.querySelectorAll('[data-dial-led]').forEach((led) => {
            var i = parseInt(led.dataset.dialLed, 10);
            led.style.background = i >= n ? '#000' : packedToCss(getPackedLed(Module.HEAPU8[dialLedPtr + i]));
          });
        }, 100);
      }

      var GRID_SIM_PORT_USB = 5;

      function startUsbPolling() {
        var pending = Module.cwrap('grid_sim_port_tx_pending', 'number', ['number']);
        var drainBytes = Module.cwrap('grid_sim_port_drain_tx_bytes', 'number', ['number', 'number', 'number']);

        var capacity = 4096;
        var bufPtr = Module._malloc(capacity);

        setInterval(() => {
          var n = pending(GRID_SIM_PORT_USB);
          if (n === 0) return;

          var copied = drainBytes(GRID_SIM_PORT_USB, bufPtr, capacity);
          appendUsbLine(escapeBytes(Module.HEAPU8.subarray(bufPtr, bufPtr + copied)));
        }, 100);
      }

      // Injects whatever's typed into the selected port's rx, as if it had
      // just arrived over that port's wire/USB - grid_sim_terminate_frame()
      // appends the checksum trailer the message needs to actually be found
      // and relayed (see its comment in wasm/sim_core.h), so a plain word or
      // a hand-built \x01... frame both work without the sender needing to
      // compute that by hand. Some classes (e.g. GRID_CLASS_EVALUATE) are
      // only recognized on specific ports - UI, not USB - hence the port
      // picker rather than always targeting USB.
      function setupUsbSend() {
        var input = document.getElementById('usb-send-input');
        var portSelect = document.getElementById('usb-send-port');
        var terminate = Module.cwrap('grid_sim_terminate_frame', 'number', ['number', 'number', 'number', 'number']);
        var inject = Module.cwrap('grid_sim_port_inject', null, ['number', 'number', 'number']);

        // Not a real history stack - just the one most recently sent
        // message, recalled with ArrowUp.
        var lastSent = '';

        function send() {
          var text = input.value;
          if (!text) return;
          var port = parseInt(portSelect.value, 10);
          lastSent = text;

          var body = parseEscapedBytes(text);
          var bodyPtr = Module._malloc(body.length);
          Module.HEAPU8.set(body, bodyPtr);

          var maxOut = body.length + 4;
          var outPtr = Module._malloc(maxOut);
          var outLen = terminate(bodyPtr, body.length, outPtr, maxOut);

          if (outLen > 0) {
            var framed = Module.HEAPU8.slice(outPtr, outPtr + outLen);
            var p = Module._malloc(framed.length);
            Module.HEAPU8.set(framed, p);
            inject(port, p, framed.length);
            Module._free(p);

            appendUsbLine('> ' + escapeBytes(framed), 'sent');
          }

          Module._free(bodyPtr);
          Module._free(outPtr);
          input.value = '';
        }

        document.getElementById('usb-send-btn').addEventListener('click', send);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            send();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            input.value = lastSent;
          }
        });
      }

      Module.onRuntimeInitialized = () => {
        setupButtonRows();
        setupDial();
        startLedPolling();
        startUsbPolling();
        setupUsbSend();
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
